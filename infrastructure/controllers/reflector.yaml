---
apiVersion: v1
kind: Namespace
metadata:
  name: reflector
  labels:
    goldilocks.fairwinds.com/enabled: 'true'
    toolkit.fluxcd.io/tenant: sre-team
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: reflector
  namespace: reflector
spec:
  interval: 24h
  url: https://emberstack.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reflector
  namespace: reflector
spec:
  interval: 30m
  chart:
    spec:
      chart: reflector
      version: 10.0.65
      sourceRef:
        kind: HelmRepository
        name: reflector
        namespace: reflector
      interval: 12h
  values:
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values: [k8s-worker-node-2, k8s-worker-node-3]
