---
apiVersion: v1
kind: Namespace
metadata:
  name: vpa
  labels:
    goldilocks.fairwinds.com/enabled: 'true'
    toolkit.fluxcd.io/tenant: sre-team
---
# Vertical Pod Autoscaler: recommender, updater and admission controller, plus metrics-server (the VPA reads the metrics API).
# Pods are only changed for VerticalPodAutoscaler objects with updateMode Auto/Recreate/InPlaceOrRecreate;
# the VPAs Goldilocks creates use updateMode "Off" (recommendations only).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vpa
  namespace: vpa
spec:
  interval: 30m
  chart:
    spec:
      chart: vpa
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: fairwinds
        namespace: flux-system
      interval: 12h
  install:
    crds: CreateReplace  # VerticalPodAutoscaler CRDs, also used by Goldilocks
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
  values:
    recommender:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [k8s-worker-node-2, k8s-worker-node-3]
      extraArgs:
        v: '2'
        pod-recommendation-min-cpu-millicores: 15
        pod-recommendation-min-memory-mb: 100
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 512Mi
    updater:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [k8s-worker-node-2, k8s-worker-node-3]
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 512Mi
    admissionController:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [k8s-worker-node-2, k8s-worker-node-3]
      # Certificate for the mutating webhook is generated by the chart's certgen job;
      # failurePolicy Ignore (chart default) means pods are still created if the webhook is down
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi
    # The cluster had no metrics-server (also gives `kubectl top`)
    metrics-server:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [k8s-worker-node-2, k8s-worker-node-3]
      enabled: true
      args:
        - --kubelet-insecure-tls  # kubeadm kubelets serve self-signed certificates
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi
# For more options use helm show values fairwinds/vpa
