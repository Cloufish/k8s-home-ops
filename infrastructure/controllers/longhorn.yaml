---
apiVersion: v1
kind: Namespace
metadata:
  name: longhorn
  labels:
    toolkit.fluxcd.io/tenant: sre-team
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: longhorn
  namespace: longhorn
spec:
  interval: 24h
  url: https://charts.longhorn.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn
spec:
  dependsOn:
    - name: cert-manager
      namespace: cert-manager
  interval: 30m
  chart:
    spec:
      chart: longhorn
      version: 1.11.3  # Longhorn refuses to skip minor versions 
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: longhorn
      interval: 12h
  values:
    ingress:
      enabled: true
      ingressClassName: nginx
      host: longhorn.${app_k8s_domain_name}
      tls: true
      tlsSecret: wildcard-${default_k8s_cert_name}
      annotations:
        nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
        nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    defaultBackupStore:
      backupTarget: s3://cloufish-k8s-at-home@eu-north-1/
      backupTargetCredentialSecret: aws-s3-secret-longhorn
