---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: n8n
  namespace: flux-system
spec:
  type: generic
  secretRef:
    name: n8n-webhook
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: n8n
  namespace: flux-system
spec:
  providerRef:
    name: n8n
  eventSeverity: error
  eventSources:
    - { kind: Kustomization, name: '*' }
    - { kind: GitRepository, name: '*' }
    - { kind: HelmRepository, name: '*' }
    # HelmReleases live in one namespace per app
    - { kind: HelmRelease, name: '*', namespace: vaultwarden }
    - { kind: HelmRelease, name: '*', namespace: n8n }
    - { kind: HelmRelease, name: '*', namespace: lidify }
    - { kind: HelmRelease, name: '*', namespace: dashy }
    - { kind: HelmRelease, name: '*', namespace: commafeed }
    - { kind: HelmRelease, name: '*', namespace: code-server }
    - { kind: HelmRelease, name: '*', namespace: pgadmin }
    - { kind: HelmRelease, name: '*', namespace: chatgpt-next }
    - { kind: HelmRelease, name: '*', namespace: dsomm }
    - { kind: HelmRelease, name: '*', namespace: composerize }
    - { kind: HelmRelease, name: '*', namespace: languagetool }
    - { kind: HelmRelease, name: '*', namespace: cyberchef }
    - { kind: HelmRelease, name: '*', namespace: prometheus-operator }
    - { kind: HelmRelease, name: '*', namespace: prometheus-blackbox-exporter }
