---
# For workloads that replicate their data themselves (CloudNativePG keeps a copy on every instance),
# so Longhorn keeps a single replica instead of 3 per instance
kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
  name: longhorn-1-replica
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
parameters:
  numberOfReplicas: '1'
  dataLocality: best-effort  # keep the replica on the node running the pod
  staleReplicaTimeout: '2880'  # 48 hours in minutes
---
# For data that is fine to lose with two nodes at once but should survive one, e.g. the Prometheus TSDB
kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
  name: longhorn-2-replicas
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
parameters:
  numberOfReplicas: '2'
  staleReplicaTimeout: '2880'  # 48 hours in minutes
