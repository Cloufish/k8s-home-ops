---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${prometheus_operator_app_name}  # This variable is defined inside clusters/production/apps.yaml
  namespace: ${prometheus_operator_app_name}
spec:
  chart:
    spec:
      version: '75.11'
  values:
    grafana:
      additionalDataSources:
        - name: Loki
          type: loki
          url: http://loki.${loki_app_name}.svc:3100
          access: proxy
      ingress:
        enabled: true
        ingressClassName: nginx
        annotations:
          nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
          nginx.ingress.kubernetes.io/ssl-redirect: 'true'
        hosts: ['grafana.${app_k8s_domain_name}']
        tls:
          - secretName: wildcard-${default_k8s_cert_name}
            hosts: ['grafana.${app_k8s_domain_name}']
    alertmanager:
      ingress:
        enabled: true
        ingressClassName: nginx
        annotations:
          nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
          nginx.ingress.kubernetes.io/ssl-redirect: 'true'
        hosts: ['alertmanager.${app_k8s_domain_name}']
        tls:
          - secretName: wildcard-${default_k8s_cert_name}
            hosts: ['alertmanager.${app_k8s_domain_name}']
    prometheus:
      ingress:
        enabled: true
        ingressClassName: nginx
        annotations:
          nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
          nginx.ingress.kubernetes.io/ssl-redirect: 'true'
        hosts: ['prometheus.${app_k8s_domain_name}']
        tls:
          - secretName: wildcard-${default_k8s_cert_name}
            hosts: ['prometheus.${app_k8s_domain_name}']
      prometheusSpec:
        # Pick up Probes, PrometheusRules and ScrapeConfigs from any namespace without requiring the `release` label
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
