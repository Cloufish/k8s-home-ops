---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${composerize_app_name}  # This variable is defined inside clusters/production/apps.yaml
  namespace: ${composerize_app_name}
spec:
  chart:
    spec:
      version: 5.1.0
  values:
    ingress:
      app:
        hosts:
          - host: ${composerize_app_name}.${app_k8s_domain_name}
            paths:
              - path: /
                pathType: Prefix
        tls:
          - hosts: ['${composerize_app_name}.${app_k8s_domain_name}']
            secretName: wildcard-${default_k8s_cert_name}
