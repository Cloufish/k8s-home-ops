---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${prometheus_blackbox_exporter_app_name}  # This variable is defined inside clusters/production/apps.yaml
  namespace: ${prometheus_blackbox_exporter_app_name}
spec:
  chart:
    spec:
      version: 11.1.0
  values:
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values: [k8s-worker-node-2, k8s-worker-node-3]
    config:
      modules:
        http_2xx:
          prober: http
          timeout: 5s
          http:
            valid_http_versions: [HTTP/1.1, HTTP/2.0]
            follow_redirects: true
            preferred_ip_protocol: ip4
        # For self-signed endpoints (Proxmox, TrueNAS)
        http_2xx_insecure:
          prober: http
          timeout: 5s
          http:
            valid_http_versions: [HTTP/1.1, HTTP/2.0]
            follow_redirects: true
            preferred_ip_protocol: ip4
            tls_config:
              insecure_skip_verify: true
        # Endpoints behind basic auth (Traefik dashboard, HAProxy stats) answer 401 when healthy
        http_401:
          prober: http
          timeout: 5s
          http:
            valid_http_versions: [HTTP/1.1, HTTP/2.0]
            valid_status_codes: [401]
            follow_redirects: true
            preferred_ip_protocol: ip4
    ingress:
      enabled: true
      className: nginx
      annotations:
        nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
        nginx.ingress.kubernetes.io/ssl-redirect: 'true'
      hosts:
        - host: prometheus-blackbox.${app_k8s_domain_name}
          paths:
            - path: /
              pathType: ImplementationSpecific
      tls:
        - secretName: wildcard-${default_k8s_cert_name}
          hosts: ['prometheus-blackbox.${app_k8s_domain_name}']
