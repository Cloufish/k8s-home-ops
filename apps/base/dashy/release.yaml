---
apiVersion: v1
kind: Namespace
metadata:
  name: ${dashy_app_name}
  labels:
    goldilocks.fairwinds.com/enabled: 'true'
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dashy
  namespace: ${dashy_app_name}
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  install:
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      # Prefer k8s-worker-node-2/3 over k8s-worker-node-1
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [k8s-worker-node-2, k8s-worker-node-3]
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/controller: ${dashy_app_name}
    controllers:
      ${dashy_app_name}:
        replicas: 2
        annotations:
          reloader.stakater.com/auto: 'true'
        containers:
          app:
            image:
              repository: ghcr.io/lissy93/dashy
              tag: 4.8.7@sha256:689a9a88b2368cfb7646458d176edf7fa378ad02218ef0cc8ccb53e1a8a3edbf
            env:
              TZ: Europe/Warsaw
              UID: 1000
              GID: 1000
              # API tokens for the proxmox-lists widgets (dashy-secret.yaml); Dashy substitutes DASHY_* values in
              # proxied widget requests. app-template's schema doesn't allow secretKeyRef.optional.
              DASHY_PROXMOX_NAS_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: dashy-secret
                    key: DASHY_PROXMOX_NAS_TOKEN
              DASHY_PROXMOX_DATACENTER_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: dashy-secret
                    key: DASHY_PROXMOX_DATACENTER_TOKEN
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop: [ALL]
            ports:
              - name: http
                containerPort: &httpPort 8080
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 3Gi
    service:
      app:
        controller: ${dashy_app_name}
        type: ClusterIP
        ports:
          http:
            port: *httpPort
            protocol: TCP
    ingress:
      app:
        className: nginx
        annotations:
          nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
          nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    persistence:
      config-file:
        type: configMap
        name: dashy-configmap
        globalMounts:
          - path: /app/user-data/conf.yml
            subPath: config.yaml  # Needs to match configMapGenerator.files in kustomization.yaml
            readOnly: true
