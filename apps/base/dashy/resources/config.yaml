---
pageInfo:
  title: Home Lab
appConfig:
  statusCheck: true
  statusCheckInterval: 60
  theme: one-dark
  fontAwesomeKey: c94dc2b452
  customCss: |
    .clock p.time { font-size: 3rem !important; }
    /* Show full item descriptions: Dashy limits them to 2 lines and the tile to 6rem height */
    .item.size-large { max-height: none !important; }
    .item.size-large .tile-title p.description { height: auto !important; max-height: 6rem; overflow-y: auto; }
    /* Wider large tiles so long descriptions need fewer lines */
    .item-wrapper.wrap-size-large { flex-basis: 16rem !important; }
  layout: horizontal
  iconSize: large  # descriptions are only shown on large tiles
sections:
  - name: Search Browser
    widgets:
      - type: custom-search
        options:
          placeholder: Search for something using the buttons below
          engines:
            - title: SearXNG
              url: https://searxng.${app_k8s_domain_name}/search?q=
  - name: Infrastructure/Networking
    items:
      - title: pfSense
        description: Main router and firewall
        icon: hl-pfsense
        url: https://192.168.1.1
        statusCheck: false
      - title: Keenetic Router
        description: Keenetic router
        icon: hl-keenetic
        url: http://192.168.1.20
      - title: TP-Link SG2218
        description: Managed switch
        icon: hl-tp-link
        url: http://192.168.1.15
      - title: Proxmox on NAS
        description: RAM 32GB, Storage 128GB, 12 vCPUs
        icon: https://f6.allesedv.com/16/proxmox.com
        url: https://192.168.1.6:8006
        statusCheckAllowInsecure: true
      - title: Proxmox on MiniPC-1
        description: RAM 8GB, Storage 512GB, 4 vCPUs
        icon: https://f6.allesedv.com/16/proxmox.com
        url: https://192.168.1.5:8006
        statusCheckAllowInsecure: true
      - title: Proxmox on MiniPC-2
        description: RAM 32GB, Storage 512GB, 6 vCPUs
        icon: https://f6.allesedv.com/16/proxmox.com
        url: https://192.168.1.7:8006
        statusCheckAllowInsecure: true
      - title: Proxmox on MiniPC-3
        description: RAM 16GB, Storage 512GB, 4 vCPUs
        icon: https://f6.allesedv.com/16/proxmox.com
        url: https://192.168.1.8:8006
        statusCheckAllowInsecure: true
      - title: Proxmox on MiniPC-4
        description: Proxmox node pve4
        icon: https://f6.allesedv.com/16/proxmox.com
        url: https://192.168.1.9:8006
        statusCheckAllowInsecure: true
      - title: Windows Server 2025 Datacenter
        description: Informational record where Active Directory lives
        icon: fab fa-windows
        url: http://192.168.1.30
        statusCheck: false
        statusCheckAllowInsecure: true
      - title: TrueNAS
        description: As Virtual Machine on my NAS Server
        icon: https://www.truenas.com/wp-content/uploads/2020/08/cropped-TN-favicon-100x100.png
        url: https://truenas.home
        statusCheckAllowInsecure: true
    widgets:
      - type: proxmox-lists
        useProxy: true  # needed for the DASHY_ env var substitution below
        allowInsecure: true  # Proxmox uses a self-signed certificate
        options:
          title: Proxmox NAS
          cluster_url: https://192.168.1.6:8006
          user_name: dashy@pve
          token_name: dashy
          token_uuid: DASHY_PROXMOX_NAS_TOKEN  # env var from the dashy-secret Secret (release.yaml)
          footer: Proxmox NAS
          footer_as_link: true
      - type: proxmox-lists
        useProxy: true
        allowInsecure: true
        options:
          title: Proxmox Datacenter
          cluster_url: https://192.168.1.5:8006
          user_name: dashy@pve
          token_name: dashy
          token_uuid: DASHY_PROXMOX_DATACENTER_TOKEN  # env var from the dashy-secret Secret (release.yaml)
          footer: Proxmox Datacenter
          footer_as_link: true
      # VMs per node (node_data: qemu); the PVEAuditor tokens above can read them too
      - type: proxmox-lists
        useProxy: true
        allowInsecure: true
        options:
          title: NAS pve VMs
          cluster_url: https://192.168.1.6:8006
          user_name: dashy@pve
          token_name: dashy
          token_uuid: DASHY_PROXMOX_NAS_TOKEN
          node: pve
          node_data: qemu
          hide_templates: 1
      - type: proxmox-lists
        useProxy: true
        allowInsecure: true
        options:
          title: Datacenter pve VMs
          cluster_url: https://192.168.1.5:8006
          user_name: dashy@pve
          token_name: dashy
          token_uuid: DASHY_PROXMOX_DATACENTER_TOKEN
          node: pve
          node_data: qemu
          hide_templates: 1
      - type: proxmox-lists
        useProxy: true
        allowInsecure: true
        options:
          title: Datacenter pve2 VMs
          cluster_url: https://192.168.1.5:8006
          user_name: dashy@pve
          token_name: dashy
          token_uuid: DASHY_PROXMOX_DATACENTER_TOKEN
          node: pve2
          node_data: qemu
          hide_templates: 1
      - type: proxmox-lists
        useProxy: true
        allowInsecure: true
        options:
          title: Datacenter pve3 VMs
          cluster_url: https://192.168.1.5:8006
          user_name: dashy@pve
          token_name: dashy
          token_uuid: DASHY_PROXMOX_DATACENTER_TOKEN
          node: pve3
          node_data: qemu
          hide_templates: 1
      - type: proxmox-lists
        useProxy: true
        allowInsecure: true
        options:
          title: Datacenter pve4 VMs
          cluster_url: https://192.168.1.5:8006
          user_name: dashy@pve
          token_name: dashy
          token_uuid: DASHY_PROXMOX_DATACENTER_TOKEN
          node: pve4
          node_data: qemu
          hide_templates: 1
