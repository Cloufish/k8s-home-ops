---
apiVersion: v1
kind: Namespace
metadata:
  name: ${hytale_app_name}
  labels:
    goldilocks.fairwinds.com/enabled: 'true'
---
# LinuxGSM Hytale server (hytserver), https://docs.linuxgsm.com/game-servers/hytale
# A Hytale account that owns the game has to approve two one-time logins; the URLs show up in the pod logs:
# 1. Install: the Hytale downloader's login URL
# 2. First start: the server's login URL. It's saved in Server/auth.enc on the volume and restored on restart.
#    To log in again: kubectl -n hytale exec -it deploy/hytale -- gosu linuxgsm ./hytserver send "/auth login device"
# Server name, password and max players are in /data/serverfiles/Server/config.json, created on first start.
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hytale
  namespace: ${hytale_app_name}
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  install:
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      terminationGracePeriodSeconds: 60  # LinuxGSM stops the server cleanly so the world is saved
    controllers:
      ${hytale_app_name}:
        replicas: 1
        strategy: Recreate  # ReadWriteOnce volume
        containers:
          app:
            image:
              repository: docker.io/gameservermanagers/gameserver
              tag: hyt
            env:
              TZ: Europe/Warsaw
              # The JVM defaults to a quarter of the memory limit as heap
              JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
            ports:
              - name: game
                containerPort: &gamePort 5520
                protocol: UDP
            resources:
              requests:
                cpu: 500m
                memory: 3Gi
              limits:
                memory: 4Gi
    service:
      app:
        controller: ${hytale_app_name}
        # Game traffic (QUIC over UDP) can't go through ingress-nginx; the LoadBalancer Service also gets a NodePort
        type: LoadBalancer
        ports:
          game:
            port: *gamePort
            protocol: UDP
    persistence:
      data:
        enabled: true
        type: persistentVolumeClaim
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 10Gi
        globalMounts:
          - path: /data
