---
apiVersion: v1
kind: Namespace
metadata:
  name: ${lidify_app_name}
  labels:
    goldilocks.fairwinds.com/enabled: 'true'
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lidify
  namespace: ${lidify_app_name}
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  install:
    remediation:
      retries: 3
  values:
    controllers:
      ${lidify_app_name}:
        replicas: 1
        annotations:
          reloader.stakater.com/auto: 'true'
        containers:
          app:
            image:
              repository: thewicklowwolf/lidify
              tag: 0.2.11
            ports:
              - name: http
                containerPort: &httpPort 5000
            env:
              - name: mode
                value: LastFM
              # gunicorn 25.1.0 (pinned by the image) can deadlock the worker on boot because of the
              # control-socket thread: https://github.com/benoitc/gunicorn/issues/3529
              - name: GUNICORN_CMD_ARGS
                value: --no-control-socket
            envFrom:
              - secretRef:
                  name: lidify-secret
            probes:
              # The default TCP probe passes even when the worker is hung, since the gunicorn master still accepts connections
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *httpPort
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probe
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 1Gi
    service:
      app:
        controller: ${lidify_app_name}
        type: ClusterIP
        ports:
          http:
            port: *httpPort
            protocol: TCP
    ingress:
      app:
        className: nginx
        annotations:
          nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
          nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    persistence:
      config:
        enabled: true
        type: persistentVolumeClaim
        storageClass: longhorn-crypto-global
        accessMode: ReadWriteOnce
        size: 2Gi
        globalMounts:
          - path: /lidify/config  # Lidify reads/writes settings_config.json here, not in /config
