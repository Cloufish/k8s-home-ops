---
apiVersion: v1
kind: Namespace
metadata:
  name: ${terraria_app_name}
  labels:
    goldilocks.fairwinds.com/enabled: 'true'
---
# LinuxGSM Terraria server (terrariaserver), https://docs.linuxgsm.com/game-servers/terraria
# SteamCMD downloads the game (appid 105600), so it needs a Steam account that owns Terraria. Until that's set up
# the install fails, but the container keeps running so the login can be done once by hand:
#   kubectl -n terraria exec -it deploy/terraria -- gosu linuxgsm bash
#   cd /data/config-lgsm/terrariaserver
#   echo 'steamuser="<user>"' > secrets-terrariaserver.cfg && echo "steampass='<password>'" >> secrets-terrariaserver.cfg
#   steamcmd +login <user> +quit    # enter the Steam Guard code; the login is cached in /data/.steam
#   exit
#   kubectl -n terraria rollout restart deploy/terraria
# The credentials stay on the volume and out of git. World settings: /data/serverfiles/terrariaserver.txt
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: terraria
  namespace: ${terraria_app_name}
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  install:
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      terminationGracePeriodSeconds: 60  # LinuxGSM stops the server cleanly so the world is saved
    controllers:
      ${terraria_app_name}:
        replicas: 1
        strategy: Recreate  # ReadWriteOnce volume
        containers:
          app:
            image:
              repository: docker.io/gameservermanagers/gameserver
              tag: terraria
            env:
              TZ: Europe/Warsaw
            ports:
              - name: game
                containerPort: &gamePort 7777
                protocol: TCP
            resources:
              requests:
                cpu: 250m
                memory: 768Mi
              limits:
                memory: 2Gi
    service:
      app:
        controller: ${terraria_app_name}
        # Game traffic is plain TCP, so it can't go through ingress-nginx; the LoadBalancer Service also gets a NodePort
        type: LoadBalancer
        ports:
          game:
            port: *gamePort
            protocol: TCP
    persistence:
      data:
        enabled: true
        type: persistentVolumeClaim
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 5Gi
        globalMounts:
          - path: /data
