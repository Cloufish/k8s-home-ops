---
apiVersion: v1
kind: Namespace
metadata:
  name: ${searxng_app_name}
  labels:
    goldilocks.fairwinds.com/enabled: 'true'
---
# SearXNG metasearch engine. /etc/searxng is an emptyDir: on every start the image creates settings.yml from its
# template (use_default_settings, image_proxy) with a random secret_key, so no Secret or volume is needed.
# Further settings go in as SEARXNG_* env vars, see https://docs.searxng.org/admin/settings/settings_server.html
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: searxng
  namespace: ${searxng_app_name}
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  install:
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      # Prefer k8s-worker-node-2/3 over k8s-worker-node-1
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [k8s-worker-node-2, k8s-worker-node-3]
    controllers:
      ${searxng_app_name}:
        replicas: 1
        containers:
          app:
            image:
              repository: docker.io/searxng/searxng
              tag: 2026.10.19-d47cb96bf@sha256:d81e14a4328ba7a57f297dff0472be629d30bf29580406c0d5b3bdab563c9bed
            env:
              TZ: Europe/Warsaw
              SEARXNG_BASE_URL: https://${searxng_app_name}.${app_k8s_domain_name}/
              SEARXNG_PORT: &httpPort 8080
              # Private instance behind oauth2-proxy: no bot limiter, so no Valkey is needed
              SEARXNG_LIMITER: 'false'
              SEARXNG_PUBLIC_INSTANCE: 'false'
            ports:
              - name: http
                containerPort: *httpPort
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *httpPort
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probe
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
    service:
      app:
        controller: ${searxng_app_name}
        type: ClusterIP
        ports:
          http:
            port: *httpPort
            protocol: TCP
    ingress:
      app:
        className: nginx
        annotations:
          nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
          nginx.ingress.kubernetes.io/ssl-redirect: 'true'
          # SearXNG has no login of its own
          nginx.ingress.kubernetes.io/auth-url: https://oauth2-proxy.cloufish.xyz/oauth2/auth
          nginx.ingress.kubernetes.io/auth-signin: https://oauth2-proxy.cloufish.xyz/oauth2/start?rd=https://$host$request_uri
    persistence:
      config:
        type: emptyDir
        globalMounts:
          - path: /etc/searxng
      cache:
        type: emptyDir
        globalMounts:
          - path: /var/cache/searxng
