---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: descheduler
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: descheduler
      version: 0.33.0
      sourceRef:
        kind: HelmRepository
        name: descheduler
        namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    replicas: 2
    kind: Deployment
    deschedulerPolicyAPIVersion: descheduler/v1alpha2
    deschedulerPolicy:
      profiles:
        - name: Default
          pluginConfig:
            - name: DefaultEvictor
              args:
                evictFailedBarePods: true
                evictLocalStoragePods: true
                evictSystemCriticalPods: true
                nodeFit: true
            - name: RemovePodsViolatingInterPodAntiAffinity
            - name: RemovePodsViolatingNodeAffinity
              args:
                nodeAffinityType: [requiredDuringSchedulingIgnoredDuringExecution]
            - name: RemovePodsViolatingNodeTaints
              args:
                # Kubernetes sets these itself for short-lived node problems and already evicts with its own grace periods;
                # evicting everything immediately on them took down NetBox's database during its first start
                excludedTaints:
                  - node.kubernetes.io/not-ready
                  - node.kubernetes.io/unreachable
                  - node.kubernetes.io/memory-pressure
                  - node.kubernetes.io/disk-pressure
                  - node.kubernetes.io/pid-pressure
                  - node.kubernetes.io/network-unavailable
            - name: RemovePodsViolatingTopologySpreadConstraint
              args:
                # Only hard spreads: soft (ScheduleAnyway) spreads would evict pods off the preferred worker-2/3 to even out worker-1
                constraints: [DoNotSchedule]
          plugins:
            balance:
              enabled: [RemovePodsViolatingTopologySpreadConstraint]
            deschedule:
              enabled:
                - RemovePodsViolatingInterPodAntiAffinity
                - RemovePodsViolatingNodeAffinity
                - RemovePodsViolatingNodeTaints
    service:
      enabled: true
    serviceMonitor:
      enabled: true
    leaderElection:
      enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 64M
      limits:
        memory: 318M
