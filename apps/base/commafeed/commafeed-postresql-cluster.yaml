---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: commafeed-postresql-cluster
  namespace: commafeed
spec:
  instances: 2
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
    # Prefer k8s-worker-node-2/3 over k8s-worker-node-1
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: [k8s-worker-node-2, k8s-worker-node-3]
  storage:
    size: 3Gi
  # Continuous WAL archiving and base backups to S3 (ObjectStore and ScheduledBackup in commafeed-postgresql-backups.yaml)
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: s3-backups
