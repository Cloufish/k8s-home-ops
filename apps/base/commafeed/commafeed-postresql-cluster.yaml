---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: commafeed-postresql-cluster
  namespace: commafeed
spec:
  instances: 3
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  storage:
    size: 3Gi
  # Continuous WAL archiving and base backups to S3 (ObjectStore and ScheduledBackup in commafeed-postgresql-backups.yaml)
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: s3-backups
