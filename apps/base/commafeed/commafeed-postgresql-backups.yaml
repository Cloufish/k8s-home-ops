---
# Backups of commafeed-postresql-cluster to S3 with the Barman Cloud plugin (infrastructure/controllers/cnpg-barman-cloud-plugin.yaml).
# The cnpg-backup-s3 Secret is reflected into this namespace from cloudnative-pg (infrastructure/secrets/cnpg-backup-s3-secret.yaml).
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: s3-backups
spec:
  retentionPolicy: 30d
  configuration:
    destinationPath: s3://cloufish-k8s-at-home/cnpg/  # backups go to <destinationPath>/<cluster name>/
    s3Credentials:
      accessKeyId:
        name: cnpg-backup-s3
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-backup-s3
        key: ACCESS_SECRET_KEY
      region:
        name: cnpg-backup-s3
        key: REGION
    wal:
      compression: gzip
    data:
      compression: gzip
  instanceSidecarConfiguration:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: commafeed-postresql-cluster-daily
spec:
  schedule: '0 0 3 * * *'  # 03:00 every day (CloudNativePG cron has seconds)
  immediate: true  # take the first backup right away
  backupOwnerReference: self
  cluster:
    name: commafeed-postresql-cluster
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
---
# Postgres and backup metrics (barman_cloud_cloudnative_pg_io_*) for the CNPG alerts in apps/base/prometheus-operator/cnpg-alerts.yaml
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: commafeed-postresql-cluster
  labels:
    release: ${prometheus_operator_app_name}  # selected by kube-prometheus-stack's podMonitorSelector
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: commafeed-postresql-cluster
      cnpg.io/podRole: instance
  podTargetLabels: [cnpg.io/cluster]
  podMetricsEndpoints:
    - port: metrics
