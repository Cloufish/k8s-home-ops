---
# Metrics and backup alerts for Longhorn (infrastructure/controllers/longhorn.yaml).
# The ServiceMonitor lives here rather than in the Longhorn chart (metrics.serviceMonitor) because the CRD comes with
# kube-prometheus-stack, which Flux installs after the infrastructure.
# category=backup also sends the alerts to n8n's Longhorn Backup Failure Explainer (route in apps/production/prometheus-operator/prometheus-operator-values.yaml).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: longhorn
  labels:
    release: ${prometheus_operator_app_name}  # selected by kube-prometheus-stack's serviceMonitorSelector
spec:
  namespaceSelector:
    matchNames: [longhorn]
  selector:
    matchLabels:
      app: longhorn-manager  # the longhorn-backend Service, one endpoint per longhorn-manager pod
  endpoints:
    - port: manager
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: longhorn-backups
spec:
  groups:
    - name: longhorn-backups
      rules:
        - alert: LonghornVolumeBackupTooOld
          # backup-default runs every 5 days (infrastructure/configs/longhorn-recurring-jobs.yaml); 6 days leaves room for a slow run.
          # longhorn_volume_last_backup_at is 0 for a volume that was never backed up, so those fire too, but only once
          # the PVC is older than 6 days and has missed a scheduled backup.
          expr: |
            time() - max by (namespace, persistentvolumeclaim) (
              label_replace(label_replace(longhorn_volume_last_backup_at, "namespace", "$1", "pvc_namespace", "(.+)"), "persistentvolumeclaim", "$1", "pvc", "(.+)")
            ) > 6 * 86400
              and on (namespace, persistentvolumeclaim)
            time() - max by (namespace, persistentvolumeclaim) (kube_persistentvolumeclaim_created{job="kube-state-metrics"}) > 6 * 86400
          for: 1h
          labels:
            # info: kept off Telegram (only critical|warning go there). The VMs are shut down at night, so the
            # 00:00 UTC backup-default run is often missed or fails while the cluster boots.
            severity: info
            category: backup
          annotations:
            summary: 'Longhorn volume {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has no backup from the last 6 days'
            description: 'This does not mean that backups do not work: the VMs are shut down at night, so the scheduled backup-default run (00:00 UTC) is often missed or fails while the cluster boots. The volume has never been backed up or its last backup is older than 6 days. Check the backup-default jobs (kubectl -n longhorn get jobs) and the backup target (kubectl -n longhorn get backuptargets). Back it up now: kubectl -n longhorn create job --from=cronjob/backup-default backup-default-manual'
        - alert: LonghornRecurringJobFailed
          # Same as CronJobLastRunFailed (workload-alerts.yaml), which skips the longhorn namespace so these runs get
          # severity info and the night shutdown note
          expr: |
            max by (namespace, owner_name, job_name) (
              kube_job_status_start_time{job="kube-state-metrics", namespace="longhorn"}
                * on (namespace, job_name) group_left (owner_name)
              max by (namespace, job_name, owner_name) (kube_job_owner{job="kube-state-metrics", namespace="longhorn", owner_kind="CronJob"})
            )
              == on (namespace, owner_name) group_left ()
            max by (namespace, owner_name) (
              kube_job_status_start_time{job="kube-state-metrics", namespace="longhorn"}
                * on (namespace, job_name) group_left (owner_name)
              max by (namespace, job_name, owner_name) (kube_job_owner{job="kube-state-metrics", namespace="longhorn", owner_kind="CronJob"})
            )
              and on (namespace, job_name)
            max by (namespace, job_name) (kube_job_failed{job="kube-state-metrics", namespace="longhorn", condition="true"}) == 1
          labels:
            severity: info
            category: backup
          annotations:
            summary: 'The last run of Longhorn recurring job {{ $labels.owner_name }} failed'
            description: 'This does not mean that backups do not work: the VMs are shut down at night, so a run missed overnight starts while the cluster boots, before the Longhorn volumes are ready, and fails. Job {{ $labels.job_name }} failed. Check the volumes are healthy (kubectl -n longhorn get volumes.longhorn.io) and rerun it with: kubectl -n longhorn create job --from=cronjob/{{ $labels.owner_name }} {{ $labels.owner_name }}-manual'
