---
apiVersion: v1
kind: Namespace
metadata:
  name: ${goldilocks_app_name}
  labels:
    goldilocks.fairwinds.com/enabled: 'true'
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: goldilocks
  namespace: ${goldilocks_app_name}
spec:
  interval: 30m
  chart:
    spec:
      chart: goldilocks
      sourceRef:
        kind: HelmRepository
        name: fairwinds
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  values:
    # Goldilocks creates a VPA (updateMode "Off", recommendations only) per workload and shows the recommended requests/limits.
    # The VPA itself and metrics-server are installed separately (infrastructure/controllers/vpa.yaml).
    vpa:
      enabled: false
    metrics-server:
      enabled: false
    controller:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [k8s-worker-node-2, k8s-worker-node-3]
      flags:
        # Only namespaces labelled goldilocks.fairwinds.com/enabled: 'true' (set on the Namespace manifests in this repo)
        on-by-default: 'false'
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
    dashboard:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [k8s-worker-node-2, k8s-worker-node-3]
      replicaCount: 1
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
# For more options use helm show values fairwinds/goldilocks
