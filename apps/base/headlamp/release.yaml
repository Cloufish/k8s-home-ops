---
apiVersion: v1
kind: Namespace
metadata:
  name: ${headlamp_app_name}
  labels:
    goldilocks.fairwinds.com/enabled: 'true'
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: ${headlamp_app_name}
spec:
  interval: 30m
  chart:
    spec:
      chart: headlamp
      sourceRef:
        kind: HelmRepository
        name: headlamp
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  values:
    # The UI asks for a token: kubectl -n headlamp create token headlamp --duration=24h
    # That ServiceAccount is bound to cluster-admin (chart default); the ingress is additionally behind oauth2-proxy.
    clusterRoleBinding:
      create: true
      clusterRoleName: cluster-admin
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values: [k8s-worker-node-2, k8s-worker-node-3]
# For more options use helm show values headlamp/headlamp
