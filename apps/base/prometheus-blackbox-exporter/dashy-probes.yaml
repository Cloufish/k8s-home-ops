        - sourceLabels: [__param_target]
          regex: https?://([0-9.]+(:[0-9]+)?).*
          targetLabel: app
      static:
        - https://192.168.1.6:8006
        - https://192.168.1.5:8006
        - https://192.168.1.7:8006
        - https://192.168.1.8:8006
        - https://truenas.home
