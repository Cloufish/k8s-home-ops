---
# Blackbox probes for the applications listed in Dashy.
# Keep in sync with apps/base/dashy/resources/config.yaml:
#   - items with `statusCheck: false` are not probed
#   - `statusCheckUrl` is probed instead of `url`
#   - only self-signed endpoints (Proxmox, TrueNAS) use the insecure module, everything else must present a valid certificate
# One Probe per Dashy section (and per blackbox module). The `app` label is derived from the URL:
#   https://jellyfin.swarm.example.com/ -> app="jellyfin", https://192.168.1.6:8006 -> app="192.168.1.6:8006"
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: dashy-infrastructure
spec:
  interval: 60s
  module: http_2xx
  prober:
    url: ${prometheus_blackbox_exporter_app_name}.${prometheus_operator_app_name}.svc:9115
  targets:
    staticConfig:
      labels:
        source: dashy
        dashy_section: Infrastructure/Networking
      relabelingConfigs:
        - sourceLabels: [__param_target]
          regex: https?://([a-z][a-z0-9-]*)[.:/].*
          targetLabel: app
        - sourceLabels: [__param_target]
          regex: https?://([0-9.]+(:[0-9]+)?).*
          targetLabel: app
      static:
        - https://traefik.${app_swarm_domain_name}
        - https://portainer.${app_swarm_domain_name}
        - http://192.168.1.160:8443/stats
        - https://whatsupdocker.${app_swarm_domain_name}
        - https://duplicati.${app_swarm_domain_name}/
        - https://longhorn.${app_k8s_domain_name}/
        - https://pgadmin.${app_k8s_domain_name}/
---
