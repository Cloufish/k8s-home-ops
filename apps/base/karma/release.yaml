---
apiVersion: v1
kind: Namespace
metadata:
  name: ${karma_app_name}
  labels:
    goldilocks.fairwinds.com/enabled: 'true'
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: karma
  namespace: ${karma_app_name}
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  install:
    remediation:
      retries: 3
  values:
    controllers:
      ${karma_app_name}:
        replicas: 1
        annotations:
          reloader.stakater.com/auto: 'true'  # Restart when karma-configmap changes
        containers:
          app:
            image:
              repository: ghcr.io/prymitive/karma
              tag: v0.133@sha256:f5d0a0ff4062291f733980de56204b2073cfdd7d00e0444c910d78ca1478adf0
            env:
              TZ: Europe/Warsaw
              # Alertmanager from kube-prometheus-stack, the operator creates this Service
              ALERTMANAGER_URI: http://alertmanager-operated.${prometheus_operator_app_name}.svc:9093
              # Used for links in the UI, so they open the Alertmanager ingress instead of the cluster-internal address
              ALERTMANAGER_EXTERNAL_URI: https://alertmanager.${app_k8s_domain_name}
              CONFIG_FILE: /etc/karma/karma.yaml
            ports:
              - name: http
                containerPort: &httpPort 8080
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *httpPort
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    service:
      app:
        controller: ${karma_app_name}
        type: ClusterIP
        ports:
          http:
            port: *httpPort
            protocol: TCP
    ingress:
      app:
        className: nginx
        annotations:
          nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
          nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    persistence:
      config-file:
        type: configMap
        name: karma-configmap
        globalMounts:
          - path: /etc/karma/karma.yaml
            subPath: karma.yaml  # Needs to match configMapGenerator.files in kustomization.yaml
            readOnly: true
