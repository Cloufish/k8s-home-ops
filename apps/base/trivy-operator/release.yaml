---
apiVersion: v1
kind: Namespace
metadata:
  name: ${trivy_operator_app_name}
  labels:
    goldilocks.fairwinds.com/enabled: 'true'
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
  namespace: ${trivy_operator_app_name}
spec:
  interval: 30m
  chart:
    spec:
      chart: trivy-operator
      sourceRef:
        kind: HelmRepository
        name: aqua
        namespace: flux-system
      interval: 12h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
  values:
    # Scans running workloads; results are VulnerabilityReport, ConfigAuditReport, ExposedSecretReport, RbacAssessmentReport
    # resources (kubectl get vulnerabilityreports -A) and Prometheus metrics (trivy_image_vulnerabilities, ...).
    operator:
      scanJobsConcurrentLimit: 1  # small nodes: one scan job at a time
      scanJobTimeout: 10m
      sbomGenerationEnabled: false  # SBOM reports are large and are stored in etcd
      clusterComplianceEnabled: false
    trivy:
      ignoreUnfixed: true  # only report what an update can fix
      severity: HIGH,CRITICAL
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 1Gi
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 512Mi
    serviceMonitor:
      enabled: true
      labels:
        release: ${prometheus_operator_app_name}  # selected by kube-prometheus-stack's serviceMonitorSelector
# For more options use helm show values aqua/trivy-operator
