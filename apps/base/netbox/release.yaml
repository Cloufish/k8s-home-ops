---
apiVersion: v1
kind: Namespace
metadata:
  name: ${netbox_app_name}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netbox
  namespace: ${netbox_app_name}
spec:
  interval: 30m
  # Chart version is pinned in infrastructure/helm-repos/netbox-repo.yaml (OCIRepository)
  chartRef:
    kind: OCIRepository
    name: netbox
    namespace: flux-system
  install:
    timeout: 15m  # first start runs all database migrations
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
  values:
    timeZone: Europe/Warsaw
    loginRequired: true
    # secret_key + email_password, and the admin user (username, email, password, api_token); see netbox-secret.yaml
    existingSecret: netbox-secret
    superuser:
      existingSecret: netbox-superuser
    # PostgreSQL from CloudNativePG (netbox-postgresql.yaml) instead of the bundled Bitnami chart
    postgresql:
      enabled: false
    externalDatabase:
      host: netbox-db-rw
      port: 5432
      database: netbox
      username: netbox
      existingSecretName: netbox-db-app  # created by CloudNativePG
      existingSecretKey: password
    # Valkey from valkey.yaml instead of the bundled Bitnami chart
    valkey:
      enabled: false
    tasksDatabase:
      host: netbox-valkey
    cachingDatabase:
      host: netbox-valkey
    persistence:
      enabled: true
      storageClass: longhorn
      size: 2Gi
    resourcesPreset: none
    resources:
      requests:
        cpu: 50m
        memory: 512Mi
      limits:
        memory: 1Gi
    worker:
      resourcesPreset: none
      resources:
        requests:
          cpu: 25m
          memory: 256Mi
        limits:
          memory: 512Mi
    housekeeping:
      enabled: true
      timezone: Europe/Warsaw
# For more options use helm show values oci://ghcr.io/netbox-community/netbox-chart/netbox
