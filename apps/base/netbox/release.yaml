---
apiVersion: v1
kind: Namespace
metadata:
  name: ${netbox_app_name}
  labels:
    goldilocks.fairwinds.com/enabled: 'true'
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netbox
  namespace: ${netbox_app_name}
spec:
  interval: 30m
  # Chart version is pinned in infrastructure/helm-repos/netbox-repo.yaml (OCIRepository)
  chartRef:
    kind: OCIRepository
    name: netbox
    namespace: flux-system
  install:
    timeout: 15m  # first start runs all database migrations
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
  values:
    timeZone: Europe/Warsaw
    loginRequired: true
    # secret_key + email_password, and the admin user (username, email, password, api_token); see netbox-secret.yaml
    existingSecret: netbox-secret
    superuser:
      existingSecret: netbox-superuser
    # PostgreSQL from CloudNativePG (netbox-postgresql.yaml) instead of the bundled Bitnami chart
    postgresql:
      enabled: false
    externalDatabase:
      host: netbox-db-rw
      port: 5432
      database: netbox
      username: netbox
      existingSecretName: netbox-db-app  # created by CloudNativePG
      existingSecretKey: password
    # Valkey from valkey.yaml instead of the bundled Bitnami chart
    valkey:
      enabled: false
    tasksDatabase:
      host: netbox-valkey
    cachingDatabase:
      host: netbox-valkey
    persistence:
      enabled: true
      storageClass: longhorn
      size: 2Gi
    # netbox and netbox-worker both mount the ReadWriteOnce media volume: stop the old pod before starting the new one
    # (a rolling update can never get the volume) and keep the worker on the web pod's node (see worker.affinity)
    updateStrategy:
      type: Recreate
    # The first start (and upgrades) run ~600 database migrations before the web server listens; the chart's
    # default (100 x 10s) restarted the container mid-migration on these small nodes. Allow up to 1h before giving up.
    startupProbe:
      enabled: true
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 360
    resourcesPreset: none
    resources:
      # The first start (~600 migrations) was OOMKilled at 1Gi; the request makes the scheduler pick a node with room.
      # Once running, Goldilocks shows the steady-state usage to lower this again.
      requests:
        cpu: 50m
        memory: 1Gi
      limits:
        memory: 2Gi
    worker:
      updateStrategy:
        type: Recreate
      affinity:
        podAffinity:
          # ReadWriteOnce media volume can only be attached to one node: run next to the netbox web pod
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: netbox
                  app.kubernetes.io/component: netbox
              topologyKey: kubernetes.io/hostname
      resourcesPreset: none
      resources:
        requests:
          cpu: 25m
          memory: 256Mi
        limits:
          memory: 512Mi
    housekeeping:
      enabled: true
      timezone: Europe/Warsaw
# For more options use helm show values oci://ghcr.io/netbox-community/netbox-chart/netbox
