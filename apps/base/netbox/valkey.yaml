---
# Task queue and cache for NetBox (the chart's bundled Bitnami Valkey only offers unpinned `latest` images).
# Nothing here needs to survive a restart, so persistence is off.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbox-valkey
  labels:
    app.kubernetes.io/name: netbox-valkey
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: netbox-valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netbox-valkey
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: docker.io/valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
          args: [--save, '', --appendonly, 'no']
          ports:
            - name: valkey
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: valkey
          livenessProbe:
            tcpSocket:
              port: valkey
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: netbox-valkey
spec:
  selector:
    app.kubernetes.io/name: netbox-valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
